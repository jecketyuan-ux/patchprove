name: patchprove
description: Verify patch execution and provenance, publish an evidence pack and optional sticky PR comment.
author: patchprove
branding:
  icon: shield
  color: purple
inputs:
  fail-on:
    description: "Residual risk failure threshold: high, critical, or none."
    required: false
    default: ""
  fail-on-new-gaps:
    description: "New gap failure threshold: high, critical, or none."
    required: false
    default: ""
  cwd:
    description: "Repository path to analyze."
    required: false
    default: ""
  github-token:
    description: "Token used only for comment publication."
    required: false
    default: "${{ github.token }}"
  comment:
    description: "Experimental sticky PR comment. Requires write permission and per-PR publisher concurrency."
    required: false
    default: "false"
  out:
    description: "Evidence JSON output path, relative to cwd."
    required: false
    default: "evidence.json"
  config:
    description: "Explicit configuration file."
    required: false
    default: ""
  spec:
    description: "Explicit verification contract."
    required: false
    default: ""
  baseline:
    description: "Evidence baseline file."
    required: false
    default: ""
  base:
    description: "Explicit diff base ref."
    required: false
    default: ""
  head:
    description: "Explicit diff head ref."
    required: false
    default: ""
  accept:
    description: "Comma-separated gap ids or path patterns to accept."
    required: false
    default: ""
  ignore:
    description: "Comma-separated ignored path patterns."
    required: false
    default: ""
  disable-gate:
    description: "Comma-separated disabled gates."
    required: false
    default: ""
  protocol:
    description: "Evidence protocol: 1 or 2."
    required: false
    default: "2"
  strict:
    description: "Require complete verification; empty uses protocol default."
    required: false
    default: ""
  isolate:
    description: "Run tools in an isolated snapshot."
    required: false
    default: "false"
  timeout-ms:
    description: "Total execution budget in milliseconds."
    required: false
    default: ""
  max-output-bytes:
    description: "Maximum captured tool output."
    required: false
    default: ""
  max-input-file-bytes:
    description: "Input resource budget; empty uses the CLI default."
    required: false
    default: ""
  max-input-total-bytes:
    description: "Input resource budget; empty uses the CLI default."
    required: false
    default: ""
  max-input-files:
    description: "Input resource budget; empty uses the CLI default."
    required: false
    default: ""
  max-json-bytes:
    description: "Input resource budget; empty uses the CLI default."
    required: false
    default: ""
  max-json-depth:
    description: "Input resource budget; empty uses the CLI default."
    required: false
    default: ""
  max-json-nodes:
    description: "Input resource budget; empty uses the CLI default."
    required: false
    default: ""
  max-graph-edges:
    description: "Input resource budget; empty uses the CLI default."
    required: false
    default: ""
  allow-plugins:
    description: "Allow configured local plugins."
    required: false
    default: "false"
  strict-config:
    description: "Treat config diagnostics as errors."
    required: false
    default: "false"
  adapter-input:
    description: "Comma-separated nx:path, turbo:path, or testmon:path inputs."
    required: false
    default: ""
  upload-sarif:
    description: "Generate and upload SARIF. Requires security-events write."
    required: false
    default: "false"
  sarif-file:
    description: "SARIF output path, relative to cwd."
    required: false
    default: "patchprove.sarif"
  receipt:
    description: "Receipt path; empty uses the evidence default, false disables."
    required: false
    default: ""
  sign:
    description: "Sign with PATCHPROVE_SIGNING_KEY."
    required: false
    default: "false"
  upload-artifacts:
    description: "Upload evidence, receipt, manifest, and SARIF artifacts."
    required: false
    default: "true"
outputs:
  status:
    description: Verification CLI exit status (0 passed, 1 failed or incomplete).
    value: ${{ steps.run.outputs.cli_status }}
  evidence:
    description: Absolute evidence JSON path.
    value: ${{ steps.run.outputs.evidence }}
  comment-file:
    description: Markdown report path for a separate publisher.
    value: ${{ steps.run.outputs.comment }}
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "22"
    - name: Build patchprove from action repo
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        REPO_ROOT="$(cd "$ACTION_PATH/.." && pwd)"
        cd "$REPO_ROOT"
        npm ci
        npm run build
        echo "PATCHPROVE_BIN=$REPO_ROOT/dist/cli.js" >> "$GITHUB_ENV"
    - name: Run patchprove
      id: run
      shell: bash
      env:
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FAIL_ON_NEW_GAPS: ${{ inputs.fail-on-new-gaps }}
        INPUT_CWD: ${{ inputs.cwd }}
        INPUT_OUT: ${{ inputs.out }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_SPEC: ${{ inputs.spec }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_ACCEPT: ${{ inputs.accept }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_DISABLE_GATE: ${{ inputs.disable-gate }}
        INPUT_PROTOCOL: ${{ inputs.protocol }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_ISOLATE: ${{ inputs.isolate }}
        INPUT_TIMEOUT_MS: ${{ inputs.timeout-ms }}
        INPUT_MAX_OUTPUT_BYTES: ${{ inputs.max-output-bytes }}
        INPUT_MAX_INPUT_FILE_BYTES: ${{ inputs.max-input-file-bytes }}
        INPUT_MAX_INPUT_TOTAL_BYTES: ${{ inputs.max-input-total-bytes }}
        INPUT_MAX_INPUT_FILES: ${{ inputs.max-input-files }}
        INPUT_MAX_JSON_BYTES: ${{ inputs.max-json-bytes }}
        INPUT_MAX_JSON_DEPTH: ${{ inputs.max-json-depth }}
        INPUT_MAX_JSON_NODES: ${{ inputs.max-json-nodes }}
        INPUT_MAX_GRAPH_EDGES: ${{ inputs.max-graph-edges }}
        INPUT_ALLOW_PLUGINS: ${{ inputs.allow-plugins }}
        INPUT_STRICT_CONFIG: ${{ inputs.strict-config }}
        INPUT_ADAPTER_INPUT: ${{ inputs.adapter-input }}
        INPUT_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        INPUT_RECEIPT: ${{ inputs.receipt }}
        INPUT_SIGN: ${{ inputs.sign }}
      run: node "${{ github.action_path }}/run.mjs"
    - name: Sticky PR comment
      id: publish
      if: always() && inputs.comment != 'false' && steps.run.outputs.comment != '' && github.event_name == 'pull_request'
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        COMMENT_FILE: ${{ steps.run.outputs.comment }}
      run: node "${{ github.action_path }}/post-comment.mjs"
    - name: Upload evidence artifacts
      if: always() && inputs.upload-artifacts != 'false'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: patchprove-evidence
        if-no-files-found: warn
        path: |
          ${{ steps.run.outputs.evidence }}
          ${{ steps.run.outputs.receipt }}
          ${{ steps.run.outputs.evidence }}.manifest.json
          ${{ steps.run.outputs.sarif }}
          ${{ steps.run.outputs.comment }}
    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true' && steps.run.outputs.sarif != ''
      uses: github/codeql-action/upload-sarif@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b # v3
      with:
        sarif_file: ${{ steps.run.outputs.sarif }}
        category: patchprove
    - name: Honor verification result
      if: always()
      shell: bash
      env:
        STATUS: ${{ steps.run.outputs.cli_status }}
      run: |
        if [ "$STATUS" = "0" ]; then exit 0; fi
        if [ "$STATUS" = "1" ]; then
          echo "patchprove: verification failed or incomplete" >&2
          exit 1
        fi
        echo "patchprove: analysis failed to produce a verification result" >&2
        exit 2
