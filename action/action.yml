name: patchprove
description: Evidence pack for AI/agent patches — impact, checks, gaps, risk. Posts a sticky PR comment.
author: patchprove
branding:
  icon: shield
  color: purple
inputs:
  fail-on:
    description: Exit non-zero when summary risk meets this threshold (high, critical, or none). Leave empty to use .patchprove.yml.
    required: false
    default: ""
  cwd:
    description: Repository path to analyze (defaults to the consumer workspace).
    required: false
    default: ""
  github-token:
    description: Token used to create or update the sticky PR comment.
    required: false
    default: ${{ github.token }}
  out:
    description: Evidence JSON output path.
    required: false
    default: evidence.json
  accept:
    description: Comma-separated gap ids or path patterns to accept (in addition to acceptGaps in config).
    required: false
    default: ""
  ignore:
    description: Comma-separated path globs to exclude from impact/gaps/findings.
    required: false
    default: ""
  upload-sarif:
    description: Generate SARIF from findings/gaps and upload with github/codeql-action/upload-sarif. Requires security-events: write.
    required: false
    default: "false"
  sarif-file:
    description: SARIF output path (used when upload-sarif is true).
    required: false
    default: patchprove.sarif
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Build patchprove from action repo
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        REPO_ROOT="$(cd "$ACTION_PATH/.." && pwd)"
        if [ ! -f "$REPO_ROOT/package.json" ]; then
          echo "patchprove: could not find package.json next to action/" >&2
          exit 2
        fi
        cd "$REPO_ROOT"
        npm ci
        npm run build
        echo "PATCHPROVE_BIN=$REPO_ROOT/dist/cli.js" >> "$GITHUB_ENV"

    - name: Run patchprove
      id: run
      shell: bash
      env:
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_CWD: ${{ inputs.cwd }}
        INPUT_OUT: ${{ inputs.out }}
        INPUT_ACCEPT: ${{ inputs.accept }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        TARGET="${INPUT_CWD:-$GITHUB_WORKSPACE}"
        ARGS=(run --cwd "$TARGET" --out "$INPUT_OUT" --format markdown)
        if [ -n "$INPUT_FAIL_ON" ]; then
          ARGS+=(--fail-on "$INPUT_FAIL_ON")
        fi
        if [ -n "$INPUT_ACCEPT" ]; then
          IFS=',' read -ra ACCEPTS <<< "$INPUT_ACCEPT"
          for item in "${ACCEPTS[@]}"; do
            item="$(echo "$item" | xargs)"
            if [ -n "$item" ]; then
              ARGS+=(--accept "$item")
            fi
          done
        fi
        if [ -n "$INPUT_IGNORE" ]; then
          IFS=',' read -ra IGNORES <<< "$INPUT_IGNORE"
          for item in "${IGNORES[@]}"; do
            item="$(echo "$item" | xargs)"
            if [ -n "$item" ]; then
              ARGS+=(--ignore "$item")
            fi
          done
        fi
        if [ "$INPUT_UPLOAD_SARIF" = "true" ]; then
          ARGS+=(--sarif "$INPUT_SARIF_FILE")
        fi
        if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
          ARGS+=(--base "$PR_BASE" --head "$PR_HEAD")
        fi
        set +e
        node "$PATCHPROVE_BIN" "${ARGS[@]}" > "$RUNNER_TEMP/patchprove-comment.md"
        STATUS=$?
        set -e
        if [ "$STATUS" -eq 2 ]; then
          echo "patchprove failed to run" >&2
          cat "$RUNNER_TEMP/patchprove-comment.md" >&2 || true
          exit 2
        fi
        echo "comment=$RUNNER_TEMP/patchprove-comment.md" >> "$GITHUB_OUTPUT"
        echo "cli_status=$STATUS" >> "$GITHUB_OUTPUT"

    - name: Sticky PR comment
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        COMMENT_FILE: ${{ steps.run.outputs.comment }}
        GH_EVENT_PATH: ${{ github.event_path }}
      run: node "${{ github.action_path }}/post-comment.mjs"

    - name: Upload SARIF
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: patchprove

    - name: Honor fail-on
      shell: bash
      run: |
        STATUS="${{ steps.run.outputs.cli_status }}"
        if [ "$STATUS" != "0" ]; then
          echo "patchprove: fail-on threshold met (exit $STATUS)" >&2
          exit "$STATUS"
        fi
