name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Keep temporary fixture repositories byte-stable
        run: git config --global core.autocrlf false
      - run: npm run check:protocol
      - run: npm run build
      - run: npm run typecheck:test
      - run: npm test
      - name: Release acceptance validator contracts
        run: node --test scripts/check-acceptance.test.mjs
      - name: Install tarball in a fresh consumer; CLI and stdio MCP smoke
        run: npm run test:package
        env:
          PATCHPROVE_PACKAGE_REPORT: artifacts/installed-package.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: installed-package-${{ matrix.os }}-node-${{ matrix.node }}
          path: artifacts/
          if-no-files-found: error

  runtimes:
    name: Real runtime fixtures / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Apply before any daemon is started, including the executor harness.
      JAVA_TOOL_OPTIONS: ${{ matrix.os == 'windows-latest' && '-Dfile.encoding=UTF-8' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.6"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, pinned
        with:
          toolchain: "1.85.0"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.os == 'windows-latest' && '21' || '17' }}
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          # Candidate upgrade includes the upstream argument-file encoding fix.
          # Non-ASCII installed cases remain required; this pin is not a support claim.
          gradle-version: "9.8.2"
      - run: npm ci
      - run: npm run build
      - name: Keep temporary fixture repositories byte-stable
        run: git config --global core.autocrlf false
      - name: Required success, failure, zero collection, missing tool, and multi-module runs
        run: npm run test:runtimes -- --require
        env:
          PATCHPROVE_RUNTIME_REPORT: artifacts/runtime-report.json
      - name: Fixed local patch corpus comparison
        run: npm run test:corpus
        env:
          PATCHPROVE_CORPUS_REPORT: artifacts/corpus-report.json
      - name: Installed CLI with original detection and plugins
        run: npm run test:package
        env:
          PATCHPROVE_PRODUCTION_ENGINES: node,python,go,cargo,maven,gradle
          PATCHPROVE_PRODUCTION_REPORT: artifacts/production-chain.json
          PATCHPROVE_PACKAGE_REPORT: artifacts/installed-package.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-corpus-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error

  contracts:
    name: Resource budgets and pinned upstream contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare explicit pinned contract tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scanner"
          curl --fail --location --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz --output "$RUNNER_TEMP/scanner/archive.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/scanner/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/scanner/archive.tar.gz" -C "$RUNNER_TEMP/scanner" gitleaks
          npm install --prefix "$RUNNER_TEMP/upstream" --ignore-scripts --no-audit --no-fund --save-exact turbo@2.5.0
          echo "GITLEAKS_BIN=$RUNNER_TEMP/scanner/gitleaks" >> "$GITHUB_ENV"
          echo "TURBO_BIN=$RUNNER_TEMP/upstream/node_modules/.bin/turbo" >> "$GITHUB_ENV"
      - run: npm run test:resources
        env:
          PATCHPROVE_RESOURCE_REPORT: artifacts/resources.json
      - run: npm run test:gitleaks
        env:
          PATCHPROVE_GITLEAKS_REPORT: artifacts/gitleaks.json
      - run: npm run test:upstream
        env:
          PATCHPROVE_UPSTREAM_REPORT: artifacts/upstream.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: resource-upstream-contracts
          path: artifacts/*.json
          if-no-files-found: error

  go-launcher:
    name: Go thin launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.6"
      - run: npm ci
      - run: npm run build
      - run: go build -o bin/patchprove ./go
      - run: ./bin/patchprove --version
      - run: ./bin/patchprove run --help

  evidence:
    name: Read-only PR evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Execute with read-only permissions and verify the artifact's integrity
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p artifacts
          set +e
          node dist/cli.js run --base "$PR_BASE" --head "$PR_HEAD" \
            --max-json-nodes 2000000 --max-json-bytes 16777216 \
            --ignore 'docs/validation/release/**' \
            --out artifacts/evidence.json --receipt artifacts/evidence.receipt.json \
            --reports-dir artifacts/machine-reports \
            --sarif artifacts/patchprove.sarif --format markdown > artifacts/comment.md
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          node dist/cli.js receipt verify artifacts/evidence.json artifacts/evidence.receipt.json --max-json-nodes 2000000 --max-json-bytes 16777216
          node dist/cli.js artifacts verify artifacts/evidence.json.manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: patchprove-pr-evidence
          path: |
            artifacts/evidence.json
            artifacts/evidence.receipt.json
            artifacts/evidence.json.manifest.json
            artifacts/patchprove.sarif
            artifacts/machine-reports/
          if-no-files-found: error
