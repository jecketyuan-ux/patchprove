name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: CLI help
        run: node dist/cli.js run --help
      - name: bin shebang
        run: head -n1 dist/cli.js | grep -q '^#!/usr/bin/env node'
      - run: npm test
      - name: npm pack dry-run
        run: npm pack --dry-run

  dogfood:
    name: dogfood patchprove on this PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Analyze this PR
        run: |
          node dist/cli.js run \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --out evidence.json \
            --sarif patchprove.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patchprove-evidence
          path: |
            evidence.json
            patchprove.sarif
