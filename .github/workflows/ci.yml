name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Keep temporary fixture repositories byte-stable
        run: git config --global core.autocrlf false
      - run: npm run check:protocol
      - run: npm run build
      - run: npm run typecheck:test
      - run: npm test
      - name: Install tarball in a fresh consumer; CLI and stdio MCP smoke
        run: npm run test:package

  runtimes:
    name: Real runtime fixtures / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.6"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, pinned
        with:
          toolchain: "1.85.0"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.12.1"
      - run: npm ci
      - run: npm run build
      - name: Keep temporary fixture repositories byte-stable
        run: git config --global core.autocrlf false
      - name: Required success, failure, zero collection, missing tool, and multi-module runs
        run: npm run test:runtimes -- --require
        env:
          PATCHPROVE_RUNTIME_REPORT: artifacts/runtime-report.json
      - name: Fixed local patch corpus comparison
        run: npm run test:corpus
        env:
          PATCHPROVE_CORPUS_REPORT: artifacts/corpus-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-corpus-${{ matrix.os }}
          path: artifacts/*.json
          if-no-files-found: error

  go-launcher:
    name: Go thin launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.6"
      - run: npm ci
      - run: npm run build
      - run: go build -o bin/patchprove ./go
      - run: ./bin/patchprove --version
      - run: ./bin/patchprove run --help

  evidence:
    name: Read-only PR evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Execute with read-only permissions and verify the artifact's integrity
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p artifacts
          set +e
          node dist/cli.js run --base "$PR_BASE" --head "$PR_HEAD" \
            --out artifacts/evidence.json --receipt artifacts/evidence.receipt.json \
            --sarif artifacts/patchprove.sarif --format markdown > artifacts/comment.md
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          node dist/cli.js receipt verify artifacts/evidence.json artifacts/evidence.receipt.json
          node dist/cli.js artifacts verify artifacts/evidence.json.manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: patchprove-pr-evidence
          path: |
            artifacts/evidence.json
            artifacts/evidence.receipt.json
            artifacts/evidence.json.manifest.json
            artifacts/patchprove.sarif
          if-no-files-found: error
